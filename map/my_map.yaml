# 地图的描述文件
image: my_map.pgm  # 描述地图路径
mode: trinary      # 描述地图数据的存储格式(三值格式 0可通行区域 1障碍物 -1未知区域)
resolution: 0.05   # 地图刻度尺(米/像素)
origin: [-0.952, -10.9, 0]   #  x轴上的偏移 y轴上的偏移 旋转角度
negate: 0                    #  是否反转
# 设置阈值
occupied_thresh: 0.65        # 灰度值 >= 0.65 是障碍物(1) 
free_thresh: 0.25            # 灰度值 <= 0.25 是可行区域