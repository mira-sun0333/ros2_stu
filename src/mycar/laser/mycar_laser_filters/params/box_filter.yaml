scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: box_filter
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_footprint
        max_x: 0.195
        max_y: 0.12
        max_z: 0.18
        min_x: -0.195
        min_y: -0.12
        min_z: -0.0
        
        invert: false # activate to remove all points outside of the box